name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: 'Build Type:'
        options:
          - 'release'
          - 'debug'
        default: 'debug'
      build_os_version:
        type: choice
        description: 'Choice a os build version machine: '
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
        default: 'ubuntu-latest'

jobs:
  build:
    name: Building APK
    runs-on: ${{ inputs.build_os_version || 'ubuntu-latest' }}
    
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
      build_type: ${{ steps.set_build_type.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build type
        id: set_build_type
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-release}"
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json from secret (base64-decode)
        env:
         GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          echo $GOOGLE_SERVICES_JSON_BASE64 | head
          mkdir -p app
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "ERROR: secrets.GOOGLE_SERVICES_JSON is empty or not set" >&2
            exit 1
          fi
          # Decode base64 content from the secret and write to file without printing the secret
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          echo "Wrote app/google-services.json (base64-decoded from secret)"

      - name: Build APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
          BUILD_TYPE: ${{ steps.set_build_type.outputs.build_type }}
        run: |
          BUILD_TASK=$(echo "$BUILD_TYPE" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          ./gradlew "assemble${BUILD_TASK}"

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        env:
          BUILD_TYPE: ${{ steps.set_build_type.outputs.build_type }}
          SHORT_SHA: ${{ steps.set_sha.outputs.short_sha }}
        run: |
          if [[ "$BUILD_TYPE" == "release" ]]; then
            mv app/build/outputs/apk/release/app-release.apk \
               "app/build/outputs/apk/release/app-release-${SHORT_SHA}.apk"
          else
            mv app/build/outputs/apk/debug/app-debug.apk \
               "app/build/outputs/apk/debug/app-debug-${SHORT_SHA}.apk"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.set_build_type.outputs.build_type }}-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/${{ steps.set_build_type.outputs.build_type }}/app-${{ steps.set_build_type.outputs.build_type }}-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f app/google-services.json
          echo "Cleaned up sensitive files"
