name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: 'Build Type:'
        options:
          - 'release'
          - 'debug'
        default: 'debug'
      build_os_version:
        type: choice
        description: 'Choice a os build version machine:'
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
        default: 'ubuntu-latest'

jobs:
  build:
    name: Building APK
    runs-on: ${{ github.event.inputs.build_os_version }}
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json from secret (base64-decode)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [[ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]]; then
            echo "ERROR: secrets.GOOGLE_SERVICES_JSON is empty or not set" >&2
            exit 1
          fi
          # Decode base64 content from the secret and write to file without printing the secret
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          echo "Wrote app/google-services.json (base64-decoded from secret)"

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk
