name: Build APK CI

on:
  push:
    paths:
      #- '.github/workflows/android.yml'
      #- 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
  workflow_dispatch:
    inputs:
      build_os_version:
        type: choice
        description: 'Choice a os build version machine: '
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
        default: 'ubuntu-latest'

jobs:
  build:
    name: Build APKs
    runs-on: ${{ inputs.build_os_version || 'ubuntu-latest' }}
    environment: GOOGLE_SERVICES_JSON
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect app-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          app_only=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo "::notice::Initial push has no base commit; retaining APK build."
            else
              if changed_files=$(git diff --no-renames --name-only "$PUSH_BEFORE" "$GITHUB_SHA"); then
                if [[ -n "$changed_files" ]]; then
                  app_only=true
                  while IFS= read -r changed_file; do
                    if [[ "$changed_file" != app/* ]]; then
                      app_only=false
                      break
                    fi
                  done <<< "$changed_files"
                else
                  echo "::warning::Could not compare push commits; retaining APK build."
                fi
              fi
            fi
          fi

          echo "app_only=$app_only" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Inject google-services.json from secret (base64-decode)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "ERROR: secrets.GOOGLE_SERVICES_JSON is empty or not set" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Clear Gradle cache
        run: ./gradlew clean

      - name: Build Release APK
        if: steps.changes.outputs.app_only != 'true'
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: |
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease

      - name: Set short SHA
        id: set_sha
        if: steps.changes.outputs.app_only != 'true'
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        if: steps.changes.outputs.app_only != 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload Release APK
        if: steps.changes.outputs.app_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk
